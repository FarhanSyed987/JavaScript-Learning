<html lang="en">

<body>
    <h1>Chai aur JavaScript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    // let num=1;
    // setInterval(()=>{
    //     console.log(`Farhan`,Date.now());
    // },1000)

    // const sayDate=function(str){
    //     console.log(str,Date.now());
    // }
    // const intervalID=setInterval(sayDate,1000,"sazneen")
    // clearInterval(intervalID)


    let num=1;
    let validInterval;
    const sayMyName=function(){
        console.log(`Farhan ${num}`);
        num++;
    }

    document.querySelector("#start").addEventListener("click",function(){
        if (!validInterval){
            validInterval=setInterval(sayMyName,1000)
        }
    })

    document.querySelector("#stop").addEventListener("click",function(){
        clearInterval(validInterval)
        validInterval=null;
        console.log(`Stopped the engine from performing ${num}th action`);
    })

</script>
</html>
